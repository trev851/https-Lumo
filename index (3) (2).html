<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14"><meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Lumo</title>
<style>
:root{--bg:#0b0f14;--pan:#141a22;--line:#232c38;--tx:#eef2f7;--mu:#8b97a8;--ac:#2dd4bf}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0b0f14ee;backdrop-filter:blur(8px);z-index:5}
.brand{font-weight:800;letter-spacing:2px;color:var(--ac);text-decoration:none}
nav{display:flex;gap:4px}nav a{color:var(--mu);text-decoration:none;padding:7px 11px;border-radius:9px;font-weight:600}nav a.on{color:var(--tx);background:var(--pan)}
main{max-width:1100px;margin:auto;padding:18px}
h2{font-size:17px;margin:22px 0 10px}h2 small{color:var(--mu);font-weight:400;font-size:12px;margin-left:6px}
.muted{color:var(--mu)}.err{color:#ff8a8a}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.card{color:inherit;text-decoration:none;flex:0 0 130px;font-size:13px}.grid .card{flex:auto}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--pan);border-radius:10px;display:block}.card span{display:block;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input,select{background:var(--pan);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:12px 14px;font:inherit;min-width:0}
button,.btn{background:var(--ac);color:#04201c;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
button.ghost{background:var(--pan);color:var(--tx);border:1px solid var(--line)}
form{display:flex;gap:8px;flex-wrap:wrap}form input{flex:1;min-width:180px}
.ad{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}.ad small{display:block;color:var(--mu);word-break:break-all}
.hero{background-size:cover;background-position:center;border-radius:16px;padding:60px 18px 18px;margin-bottom:14px;box-shadow:inset 0 -140px 100px -40px var(--bg)}.hero h1{margin:0 0 4px;font-size:clamp(26px,5vw,40px)}
video{width:100%;max-height:70vh;background:#000;border-radius:12px}
.eps{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.eps button{background:var(--pan);color:var(--tx);border:1px solid var(--line);padding:8px 12px}.eps button.on{border-color:var(--ac);color:var(--ac)}
.src{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:10px 0}.src small{color:var(--mu);display:block}
.auth{max-width:380px;margin:30px auto;display:grid;gap:10px}.auth form{display:grid}
</style></head><body>
<header><a class="brand" href="#/" id="bn"></a><nav id="nav"></nav></header>
<main id="app"></main>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<script>
const C=window.APP_CONFIG||{},NAME=C.APP_NAME||'Lumo',sb=!!(C.SUPABASE_URL&&C.SUPABASE_ANON_KEY);
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CINE='https://v3-cinemeta.strem.io/manifest.json';
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const S={user:null,token:null,urls:store.get('urls',[CINE]),addons:[]};
document.title=NAME;$('#bn').textContent=NAME.toUpperCase();
const base=u=>u.replace(/\/manifest\.json.*$/,'').replace(/\/$/,'');
const norm=u=>{u=u.trim().replace(/^stremio:\/\//,'https://');if(!/^https?:\/\//.test(u))u='https://'+u;return /manifest\.json/.test(u)?u:u.replace(/\/$/,'')+'/manifest.json'};
async function J(u){const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(t)}}
async function loadAddons(){const r=await Promise.allSettled(S.urls.map(async u=>({url:u,base:base(u),m:await J(u)})));S.addons=r.filter(x=>x.status==='fulfilled').map(x=>x.value)}
function has(a,res,type,id){const m=a.m;return(m.resources||[]).some(r=>{const o=typeof r==='object',n=o?r.name:r;if(n!==res)return false;const t=(o&&r.types)||m.types||[],p=(o&&r.idPrefixes)||m.idPrefixes;return(!type||!t.length||t.includes(type))&&(!p||!id||p.some(x=>id.startsWith(x)))})}
const cx=c=>c.extra||(c.extraSupported||[]).map(n=>({name:n,isRequired:(c.extraRequired||[]).includes(n)}));
const browsable=c=>!cx(c).some(e=>e.isRequired),searchable=c=>cx(c).some(e=>e.name==='search');
const vlc=u=>{const m=String(u).match(/^(https?):\/\/(.*)$/);return m?`intent://${m[2]}#Intent;scheme=${m[1]};package=org.videolan.vlc;type=video/*;end`:u};
const cards=(ms,t)=>ms.map(m=>`<a class="card" href="#/item/${esc(m.type||t)}/${encodeURIComponent(m.id)}"><img loading="lazy" src="${esc(m.poster||'')}" alt=""><span>${esc(m.name)}</span></a>`).join('');
// Supabase auth (email + password). Addon list is saved in the account's user metadata.
async function sbf(p,o={}){const r=await fetch(C.SUPABASE_URL+p,{...o,headers:{apikey:C.SUPABASE_ANON_KEY,'Content-Type':'application/json',...(S.token?{Authorization:'Bearer '+S.token}:{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.msg||j.error_description||j.message||'Request failed');return j}
function setSession(j){S.token=j.access_token;S.user=j.user;store.set('sess',{a:j.access_token,r:j.refresh_token});const m=j.user&&j.user.user_metadata&&j.user.user_metadata.addons;if(Array.isArray(m)&&m.length){S.urls=m;store.set('urls',m)}else saveUrls()}
async function saveUrls(){store.set('urls',S.urls);if(S.token)try{await sbf('/auth/v1/user',{method:'PUT',body:JSON.stringify({data:{addons:S.urls}})})}catch{}}
async function restore(){const s=store.get('sess');if(!sb||!s)return;try{S.token=s.a;const u=await sbf('/auth/v1/user');S.user=u;const m=u.user_metadata&&u.user_metadata.addons;if(Array.isArray(m)&&m.length)S.urls=m}catch{try{S.token=null;setSession(await sbf('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:s.r})}))}catch{S.token=S.user=null;store.set('sess',null)}}}
// Screens
async function home(){
 const jobs=[];S.addons.forEach(a=>(a.m.catalogs||[]).filter(browsable).slice(0,3).forEach(c=>jobs.push({a,c})));
 const js=jobs.slice(0,8);
 if(!js.length){app.innerHTML='<p class="muted">No catalogs yet. Add an addon on the Addons page.</p>';return}
 app.innerHTML=js.map((j,i)=>`<h2>${esc(j.c.name||j.c.id)}<small>${esc(j.a.m.name)}</small></h2><div class="row" id="r${i}"><p class="muted">Loading…</p></div>`).join('');
 js.forEach(async(j,i)=>{let h;try{const d=await J(`${j.a.base}/catalog/${j.c.type}/${j.c.id}.json`);h=cards(d.metas||[],j.c.type)||'<p class="muted">Nothing here</p>'}catch{h='<p class="muted">This addon did not respond</p>'}const el=$('#r'+i);if(el)el.innerHTML=h})}
async function search(q){
 app.innerHTML=`<form id="sf"><input id="q" value="${esc(q)}" placeholder="Search movies and shows"><button>Search</button></form><div id="res" class="grid" style="margin-top:16px"></div>`;
 $('#sf').onsubmit=e=>{e.preventDefault();location.hash='#/search/'+encodeURIComponent($('#q').value.trim())};
 if(!q)return;$('#res').innerHTML='<p class="muted">Searching…</p>';
 const jobs=[];S.addons.forEach(a=>(a.m.catalogs||[]).filter(searchable).forEach(c=>jobs.push({a,c})));
 const seen=new Set(),out=[];
 await Promise.allSettled(jobs.slice(0,10).map(async j=>{const d=await J(`${j.a.base}/catalog/${j.c.type}/${j.c.id}/search=${encodeURIComponent(q)}.json`);(d.metas||[]).forEach(m=>{const k=m.type+m.id;if(!seen.has(k)){seen.add(k);out.push(m)}})}));
 const el=$('#res');if(el)el.innerHTML=out.length?cards(out):'<p class="muted">No results. Make sure you have an addon with search, like Cinemeta.</p>'}
async function item(type,id){
 app.innerHTML='<p class="muted">Loading…</p>';let meta=null;
 for(const a of S.addons.filter(a=>has(a,'meta',type,id))){try{const d=await J(`${a.base}/meta/${type}/${encodeURI(id)}.json`);if(d.meta){meta=d.meta;break}}catch{}}
 meta=meta||{id,type,name:id};
 const vids=(meta.videos||[]).filter(v=>v.season!=null||v.episode!=null||v.id),seasons=[...new Set(vids.map(v=>v.season??0))].sort((a,b)=>a-b);
 app.innerHTML=`<div class="hero" style="background-image:linear-gradient(#0b0f1488,#0b0f14),url('${esc(meta.background||meta.poster||'')}')"><h1>${esc(meta.name)}</h1><p class="muted">${esc([meta.year||meta.releaseInfo,meta.runtime,(meta.genres||[]).join(', ')].filter(Boolean).join(' · '))}</p><p>${esc(meta.description||'')}</p></div>
 <video id="pl" controls playsinline hidden></video><p id="pe" class="err" hidden></p><div id="eps"></div><div id="st"></div>`;
 if(type==='series'&&vids.length){
  const draw=s=>{$('#eps').innerHTML=`<select id="ss">${seasons.map(x=>`<option value="${x}" ${x===s?'selected':''}>Season ${x}</option>`).join('')}</select><div class="eps">${vids.filter(v=>(v.season??0)===s).map(v=>`<button data-v="${esc(v.id)}">${esc(v.episode??'')}${v.title||v.name?' · '+esc(v.title||v.name):''}</button>`).join('')}</div>`;
   $('#ss').onchange=e=>draw(+e.target.value);
   $('#eps').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;$('#eps').querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');streams(type,b.dataset.v)}};
  draw(seasons.includes(1)?1:seasons[0])}
 else streams(type,id)}
async function streams(type,id){
 const el=$('#st');el.innerHTML='<p class="muted">Finding sources…</p>';const list=[];
 await Promise.allSettled(S.addons.filter(a=>has(a,'stream',type,id)).map(async a=>{const d=await J(`${a.base}/stream/${type}/${encodeURI(id)}.json`);(d.streams||[]).forEach(s=>list.push({a,s}))}));
 if(!list.length){el.innerHTML='<p class="muted">No sources found. Add a stream addon on the Addons page.</p>';return}
 el.innerHTML='<h2>Sources</h2>'+list.map((x,i)=>{const s=x.s;let b='<small>Torrent: not playable in a browser</small>';
  if(s.url&&/^https?:/.test(s.url))b=`<div><button data-i="${i}">Play</button> <a class="btn" style="background:#f28c1a" href="${esc(vlc(s.url))}">VLC</a>${s.behaviorHints&&s.behaviorHints.notWebReady?'<small>May not play in a browser</small>':''}</div>`;else if(s.externalUrl)b=`<a class="btn" target="_blank" rel="noopener" href="${esc(s.externalUrl)}">Open</a>`;else if(s.ytId)b=`<a class="btn" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${esc(s.ytId)}">YouTube</a>`;
  return `<div class="src"><div>${esc((s.name||'')+' '+(s.title||s.description||'')).slice(0,160)}<small>${esc(x.a.m.name)}</small></div>${b}</div>`}).join('');
 el.onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;const s=list[b.dataset.i].s,v=$('#pl'),pe=$('#pe');pe.hidden=true;v.hidden=false;
  if(window._hls){window._hls.destroy();window._hls=null}
  const fail=()=>{pe.innerHTML=`This source couldn't play in the browser. Some formats (MKV, HEVC) or protected links need an external player. <a class="btn" style="background:#f28c1a" href="${esc(vlc(s.url))}">Open in VLC</a> <a class="btn" href="${esc(s.url)}" target="_blank" rel="noopener">Open link</a> <button class="ghost" id="cp">Copy link</button>`;pe.hidden=false;$('#cp').onclick=()=>{try{navigator.clipboard.writeText(s.url)}catch{}}};
  v.onerror=fail;
  if(/\.m3u8(\?|$)/i.test(s.url)&&window.Hls&&Hls.isSupported()){window._hls=new Hls();window._hls.loadSource(s.url);window._hls.attachMedia(v);window._hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)fail()})}else v.src=s.url;
  v.play().catch(()=>{});v.scrollIntoView({behavior:'smooth'})}}
function addons(){
 app.innerHTML=`<h2>Addons</h2><p class="muted">Paste an addon's manifest link. ${esc(NAME)} hosts no media: add only addons and sources you have the right to use. Addon links must start with https.</p><form id="af"><input id="au" placeholder="https://example.com/manifest.json"><button>Add</button></form><p id="am" class="err"></p>
 ${S.urls.map((u,i)=>{const a=S.addons.find(x=>x.url===u);return `<div class="ad"><div><b>${esc(a?a.m.name:'Not responding')}</b><small>${esc(u)}</small></div><button class="ghost" data-d="${i}">Remove</button></div>`}).join('')}`;
 $('#af').onsubmit=async e=>{e.preventDefault();const u=norm($('#au').value);try{const m=await J(u);if(!m.id||!m.resources)throw 0;if(!S.urls.includes(u))S.urls.push(u);await saveUrls();await loadAddons();addons()}catch{$('#am').textContent='That link did not return a valid addon manifest.'}};
 app.onclick=async e=>{const b=e.target.closest('[data-d]');if(!b)return;S.urls.splice(+b.dataset.d,1);await saveUrls();await loadAddons();addons()}}
function account(){
 if(S.user){app.innerHTML=`<div class="auth"><h2>Account</h2><p>${esc(S.user.email)}</p><p class="muted">Your addons sync to this account.</p><button id="so">Sign out</button></div>`;
  $('#so').onclick=()=>{S.token=S.user=null;store.set('sess',null);store.set('guest',false);location.hash='#/account';nav()};return}
 if(!sb){app.innerHTML=`<div class="auth"><h2>Account</h2><p class="muted">Sign-in isn't set up yet, so your addons are saved on this device only. Add your Supabase details to config.js to turn it on.</p></div>`;return}
 app.innerHTML=`<div class="auth"><h2>Sign in to ${esc(NAME)}</h2><form id="lf"><input id="em" type="email" placeholder="Email" required autocomplete="email"><input id="pw" type="password" placeholder="Password (6+ characters)" required minlength="6" autocomplete="current-password"><button data-m="in">Sign in</button><button type="button" class="ghost" id="su">Create account</button></form><p id="ae" class="err"></p><a href="#/" id="gu" class="muted">Continue without an account</a></div>`;
 const go=async m=>{const email=$('#em').value.trim(),password=$('#pw').value;if(!email||password.length<6){$('#ae').textContent='Enter your email and a password of at least 6 characters.';return}try{const j=await sbf(m==='up'?'/auth/v1/signup':'/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});if(!j.access_token){$('#ae').textContent='Check your email to confirm your account, then sign in.';return}setSession(j);await loadAddons();location.hash='#/';nav()}catch(x){$('#ae').textContent=x.message}};
 $('#lf').onsubmit=e=>{e.preventDefault();go('in')};$('#su').onclick=()=>go('up');$('#gu').onclick=()=>store.set('guest',true)}
function nav(){const p=location.hash.slice(2).split('/')[0]||'home';$('#nav').innerHTML=[['home','#/','Home'],['search','#/search/','Search'],['addons','#/addons','Addons'],['account','#/account',S.user?'Account':'Sign in']].map(([k,h,t])=>`<a href="${h}" class="${p===k?'on':''}">${t}</a>`).join('')}
function route(){const p=location.hash.slice(2).split('/');app.onclick=null;nav();
 if(sb&&!S.user&&!store.get('guest')&&p[0]!=='account'){location.hash='#/account';return}
 ({'':()=>home(),search:()=>search(decodeURIComponent(p[1]||'')),addons,account,item:()=>item(p[1],decodeURIComponent(p[2]||''))}[p[0]]||home)()}
addEventListener('hashchange',route);
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
(async()=>{app.innerHTML='<p class="muted">Loading…</p>';await restore();await loadAddons();route()})();
</script></body></html>
