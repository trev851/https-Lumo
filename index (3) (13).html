const shiftVtt=(t,o)=>!o?t:t.split('\n').map(l=>l.includes('-->')?l.replace(/(?:(\d+):)?(\d+):(\d+)\.(\d+)/g,(_,H,M,S2,ms)=>fmt((+H||0)*3600+(+M)*60+(+S2)+parseFloat('0.'+ms)+o)):l).join('\n');
function paintSub(v){v.querySelectorAll('track').forEach(t=>t.remove());if(!SRAW)return;const tr=document.createElement('track');tr.kind='subtitles';tr.default=true;tr.src=URL.createObjectURL(new Blob([shiftVtt(SRAW,SDOFF)],{type:'text/vtt'}));v.appendChild(tr);tr.track.mode='showing'}
async function setSub(v,u){v.querySelectorAll('track').forEach(t=>t.remove());SRAW='';if(!u)return;try{SRAW=toVtt(await(await fetch(u)).text());paintSub(v)}catch{const pe=$('#pe');pe.textContent='Could not load that subtitle file.';pe.hidden=false}}
function library(){app.innerHTML='<h2>My Library</h2>'+(S.lib.length?`<p><button class="ghost" id="lr">🎲 Random pick</button></p><div class="grid">${cards(S.lib)}</div>`:'<p class="muted">Nothing saved yet. Open a title and tap Add to Library.</p>');if($('#lr'))$('#lr').onclick=()=>goItem(pick(S.lib))}
let D={t:'',ci:0,g:'',tok:0};
function discover(sub){
 app.innerHTML=`<div class="eps"><button class="${sub?'':'on'}" data-t="">Browse</button><button class="${sub?'on':''}" data-t="addons">Addons</button></div><div id="dv"></div>`;
 app.onclick=e=>{const b=e.target.closest('[data-t]');if(b)location.hash='#/discover'+(b.dataset.t?'/'+b.dataset.t:'')};
 sub==='addons'?dAddons():dBrowse()}
function dBrowse(){
 const all=catsAll();
 const types=[...new Set(all.map(x=>x.c.type))];
 if(!types.length){$('#dv').innerHTML='<p class="muted">No browsable catalogs yet. Add an addon first.</p>';return}
 if(!types.includes(D.t))D.t=types[0];
 const list=all.filter(x=>x.c.type===D.t);if(D.ci>=list.length)D.ci=0;
 const cur=list[D.ci],gx=cx(cur.c).find(e=>e.name==='genre'),gs=(gx&&gx.options)||[];if(!gs.includes(D.g))D.g='';
 $('#dv').innerHTML=`<form id="df" onsubmit="return false"><select id="dt">${types.map(t=>`<option ${t===D.t?'selected':''}>${esc(t)}</option>`).join('')}</select><select id="dc">${list.map((x,i)=>`<option value="${i}" ${i===D.ci?'selected':''}>${esc((x.c.name||x.c.id)+' · '+x.a.m.name)}</option>`).join('')}</select>${gs.length?`<select id="dg"><option value="">All genres</option>${gs.map(g=>`<option ${g===D.g?'selected':''}>${esc(g)}</option>`).join('')}</select>`:''}<button type="button" class="ghost" id="dr">🎲 Random</button></form><div id="dgrid" class="grid" style="margin-top:16px"></div><p><button id="dm" class="ghost" hidden>Load more</button></p>`;
 $('#dt').onchange=e=>{D.t=e.target.value;D.ci=0;D.g='';dBrowse()};
 $('#dc').onchange=e=>{D.ci=+e.target.value;D.g='';dBrowse()};
 if($('#dg'))$('#dg').onchange=e=>{D.g=e.target.value;dBrowse()};
 const my=++D.tok,seen=new Set();let skip=0;D.items=[];
 const load=async()=>{const bt=$('#dm');bt.hidden=true;const ex=[D.g&&'genre='+encodeURIComponent(D.g),skip&&'skip='+skip].filter(Boolean).join('&');
  try{const d=await J(`${cur.a.base}/catalog/${cur.c.type}/${cur.c.id}${ex?'/'+ex:''}.json`);if(my!==D.tok)return;const raw=d.metas||[],ms=vis(raw,cur.c.type).filter(m=>!seen.has(m.id));ms.forEach(m=>{seen.add(m.id);D.items.push({...m,type:m.type||cur.c.type})});skip+=raw.length;
   const g=$('#dgrid');if(!g)return;g.insertAdjacentHTML('beforeend',cards(ms,cur.c.type));if(!skip)g.innerHTML='<p class="muted">Nothing here.</p>';bt.hidden=!raw.length}
  catch{const g=$('#dgrid');if(g&&my===D.tok)g.insertAdjacentHTML('beforeend','<p class="muted">This catalog did not respond.</p>')}};
 $('#dm').onclick=load;$('#dr').onclick=()=>{if(D.items.length)goItem(pick(D.items))};load()}
async function dAddons(){
 const el=$('#dv');el.innerHTML='<p class="muted">Looking for addons…</p>';
 const found=new Map(),add=(u,m,off)=>{if(u&&/^https?:/.test(u)&&!found.has(u))found.set(u,{u,m:m||{},off})};
 await Promise.allSettled(S.addons.flatMap(a=>(a.m.addonCatalogs||[]).slice(0,4).map(async c=>{const d=await J(`${a.base}/addon_catalog/${c.type}/${c.id}.json`);(d.addons||[]).forEach(x=>add(x.transportUrl,x.manifest,x.flags&&x.flags.official))})));
 try{const d=await J('https://api.strem.io/addonscollection.json'),arr=Array.isArray(d)?d:(d.addons||[]);arr.forEach(x=>add(x.transportUrl,x.manifest,x.flags&&x.flags.official))}catch{}
 if(!found.size)for(const u of [CINE,'https://opensubtitles-v3.strem.io/manifest.json','https://watchhub.strem.io/manifest.json','https://v3-channels.strem.io/manifest.json']){try{add(u,await J(u),true)}catch{}}
 const bh=x=>x.m.behaviorHints||{};
 const all=[...found.values()].filter(x=>x.m.name&&!bh(x).adult&&!bh(x).configurationRequired).sort((a,b)=>(!!b.off-!!a.off)||a.m.name.localeCompare(b.m.name));
 const draw=q=>{const L=all.filter(x=>!S.urls.includes(x.u)&&(!q||(x.m.name+' '+(x.m.description||'')).toLowerCase().includes(q))).slice(0,60);
  $('#al').innerHTML=L.length?L.map(x=>`<div class="ad"><div><b>${esc(x.m.name)}</b>${x.off?' · Official':''}<small>${esc((x.m.description||'').slice(0,140))}</small><small>${esc((x.m.types||[]).join(', '))}${bh(x).p2p?' · torrent-based, not playable in a browser':''}</small></div><button data-u="${esc(x.u)}">Add</button></div>`).join(''):'<p class="muted">Nothing to show.</p>'};
 el.innerHTML=`<p class="muted">Addons from Stremio's public list and from your installed addons. ${esc(NAME)} hosts no media: add only addons and sources you have the right to use.</p><form onsubmit="return false"><input id="aq" placeholder="Filter addons"></form><div id="al"></div>`;
 $('#aq').oninput=e=>draw(e.target.value.toLowerCase());draw('');
 el.onclick=async e=>{const b=e.target.closest('[data-u]');if(!b)return;b.disabled=true;b.textContent='Adding…';S.urls.push(b.dataset.u);await saveUrls();await loadAddons();draw($('#aq').value.toLowerCase())}}
function addons(){
 app.innerHTML=`<h2>Addons</h2><p class="muted">Paste an addon's manifest link. ${esc(NAME)} hosts no media: add only addons and sources you have the right to use. Addon links must start with https.</p><form id="af"><input id="au" placeholder="https://example.com/manifest.json"><button>Add</button></form><p id="am" class="err"></p>${S.addons.length<S.urls.length?'<p><button class="ghost" id="rt">Retry failed addons</button></p>':''}
 ${S.urls.map((u,i)=>{const a=S.addons.find(x=>x.url===u);return `<div class="ad"><div><b>${esc(a?a.m.name:'Not loaded')}</b><small>${esc(u)}</small>${a?'':`<small class="err">${esc((S.fail&&S.fail[u])||'')}</small>`}</div><button class="ghost" data-d="${i}">Remove</button></div>`}).join('')}`;
 $('#af').onsubmit=async e=>{e.preventDefault();const u=norm($('#au').value);try{const m=await J(u,20000);if(!m||!(m.id||m.name))throw new Error('bad');if(!S.urls.includes(u))S.urls.push(u);await saveUrls();await loadAddons();addons()}catch(x){$('#am').textContent=why(x,u)}};
 if($('#rt'))$('#rt').onclick=async()=>{$('#rt').textContent='Retrying…';await loadAddons();addons()};
 app.onclick=async e=>{const b=e.target.closest('[data-d]');if(!b)return;S.urls.splice(+b.dataset.d,1);await saveUrls();await loadAddons();addons()}}
function account(){
 if(S.user){app.innerHTML=`<div class="auth"><h2>Account</h2><p>${esc(S.user.email)}</p><p class="muted">Your addons sync to this account.</p><button id="so">Sign out</button></div>`;
  $('#so').onclick=()=>{S.token=S.user=null;store.set('sess',null);store.set('guest',false);location.hash='#/account';nav()};return}
 if(!sb){app.innerHTML=`<div class="auth"><h2>Account</h2><p class="muted">Sign-in isn't set up yet, so your addons are saved on this device only. Add your Supabase details to config.js to turn it on.</p></div>`;return}
 app.innerHTML=`<div class="auth"><h2>Sign in to ${esc(NAME)}</h2><form id="lf"><input id="em" type="email" placeholder="Email" required autocomplete="email"><input id="pw" type="password" placeholder="Password (6+ characters)" required minlength="6" autocomplete="current-password"><button data-m="in">Sign in</button><button type="button" class="ghost" id="su">Create account</button></form><p id="ae" class="err"></p><a href="#/" id="gu" class="muted">Continue without an account</a></div>`;
 const go=async m=>{const email=$('#em').value.trim(),password=$('#pw').value;if(!email||password.length<6){$('#ae').textContent='Enter your email and a password of at least 6 characters.';return}try{const j=await sbf(m==='up'?'/auth/v1/signup':'/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});if(!j.access_token){$('#ae').textContent='Check your email to confirm your account, then sign in.';return}setSession(j);await loadAddons();location.hash='#/';nav()}catch(x){$('#ae').textContent=x.message}};
 $('#lf').onsubmit=e=>{e.preventDefault();go('in')};$('#su').onclick=()=>go('up');$('#gu').onclick=()=>store.set('guest',true)}
function nav(){const p=location.hash.slice(2).split('/')[0]||'home';$('#nav').innerHTML=[['home','#/','Home'],['search','#/search/','Search'],['discover','#/discover','Discover'],['library','#/library','Library'],['multi','#/multi','Multi'+(MV.filter(Boolean).length?' ('+MV.filter(Boolean).length+')':'')],['addons','#/addons','Addons'],['account','#/account',S.user?'Account':'Sign in']].map(([k,h,t])=>`<a href="${h}" class="${p===k?'on':''}">${t}</a>`).join('')}
function route(){const p=location.hash.slice(2).split('/');app.onclick=null;clearInterval(nxT);MVH.forEach(x=>{try{x&&x.destroy()}catch{}});MVH=[];nav();
 if(sb&&!S.user&&!store.get('guest')&&p[0]!=='account'){location.hash='#/account';return}
 ({'':()=>home(),search:()=>search(decodeURIComponent(p[1]||'')),addons,library,multi,account,discover:()=>discover(p[1]),item:()=>item(p[1],decodeURIComponent(p[2]||''))}[p[0]]||home)()}
addEventListener('hashchange',route);
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
(async()=>{app.innerHTML='<p class="muted">Loading…</p>';await restore();await loadAddons();route()})();
</script></body></html>
